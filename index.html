<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10231f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe" />
    <title>Tic-Tac-Toe</title>
    <link rel="manifest" href="/tic-tac-toe/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/tic-tac-toe/icons/icon-180.png" />
    <link rel="icon" type="image/png" href="/tic-tac-toe/icons/icon-192.png" />
    <link rel="stylesheet" href="/tic-tac-toe/styles.css" />
  </head>
  <body>
    <main>
      <h1>Tic-Tac-Toe</h1>
      <p id="status" class="status" aria-live="polite">Your turn</p>
      <p id="score" class="score">Wins 0 · Losses 0 · Draws 0</p>
      <div id="board" class="board" role="group" aria-label="Tic-tac-toe board">
        <button type="button" data-index="0" aria-label="Row 1, column 1"></button>
        <button type="button" data-index="1" aria-label="Row 1, column 2"></button>
        <button type="button" data-index="2" aria-label="Row 1, column 3"></button>
        <button type="button" data-index="3" aria-label="Row 2, column 1"></button>
        <button type="button" data-index="4" aria-label="Row 2, column 2"></button>
        <button type="button" data-index="5" aria-label="Row 2, column 3"></button>
        <button type="button" data-index="6" aria-label="Row 3, column 1"></button>
        <button type="button" data-index="7" aria-label="Row 3, column 2"></button>
        <button type="button" data-index="8" aria-label="Row 3, column 3"></button>
      </div>
      <button type="button" id="new-game" class="new-game">New game</button>
    </main>
    <script src="/tic-tac-toe/game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/tic-tac-toe/sw.js", { scope: "/tic-tac-toe/" });
      }
    </script>
  </body>
</html>
